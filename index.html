  .brand { font-weight: 650; font-stretch: 75%; font-size: 1.2rem; letter-spacing: -0.01em; text-decoration: none; white-space: nowrap; }

  .icon-btn {

  }

  .nav.on-hero .icon-btn { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.28); }
  .progress {
    position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    transform-origin: 0 50%; transform: scaleX(var(--progress, 0));
    background: linear-gradient(90deg, var(--trust), var(--energy));
  }
  @media (max-width: 640px) { .nav-links .opt { display: none; } .nav-links { gap: 18px; } }

  /* ---------- Hero (trust navy) ---------- */
  .hero, .contact {
    position: relative; overflow: hidden; color: var(--on-hero);
    background:
      radial-gradient(1100px 560px at 80% -10%, rgba(88, 128, 255, 0.36), transparent 60%),

  .hero-grid { display: grid; grid-template-columns: 7fr 5fr; gap: 56px; align-items: end; }
  .hero-name { font-size: clamp(3.2rem, 8.6vw, 6.1rem); font-weight: 700; color: #FFFFFF; }
  .word { display: inline-block; white-space: nowrap; }
  .ch { display: inline-block; }
  .hero-role { margin-top: 14px; font-size: clamp(1.15rem, 2.2vw, 1.45rem); font-weight: 500; color: var(--on-hero); }
  .hero-summary { margin-top: 24px; max-width: 54ch; font-size: 1.1rem; color: var(--on-hero-soft); }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }

  .btn {
    position: relative; overflow: hidden;
    display: inline-flex; align-items: center; gap: 9px;
    height: 48px; padding: 0 22px; border-radius: 10px;
    font: inherit; font-size: 0.98rem; font-weight: 650; text-decoration: none; cursor: pointer;

    transform: skewX(-18deg); transition: left .65s ease;

  .btn-energy:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -12px rgba(242, 154, 38, 0.95); }
  .btn-energy:hover::after { left: 125%; }

  .btn-ghost:hover { border-color: #FFFFFF; transform: translateY(-2px); }

  .panel {
    position: relative; overflow: hidden;
    background: rgba(255,255,255,0.06); border: 1px solid var(--hero-line); border-radius: 16px;
    padding: 24px 26px 8px;

  .panel::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s ease;

    var mouse = { x: -9999, active: 0, target: 0 };
    var waves = [
      { y: 0.80, amp: 26, freq: 0.0085, speed: 0.55, phase: 0.0, width: 1.6, color: "rgba(120, 160, 255, 0.55)" },
      { y: 0.84, amp: 18, freq: 0.0125, speed: -0.42, phase: 1.3, width: 1.2, color: "rgba(120, 160, 255, 0.30)" },
      { y: 0.87, amp: 32, freq: 0.0062, speed: 0.34, phase: 2.1, width: 2.0, color: "rgba(242, 154, 38, 0.80)" },
      { y: 0.91, amp: 14, freq: 0.0180, speed: 0.85, phase: 0.7, width: 1.0, color: "rgba(180, 205, 255, 0.24)" },
      { y: 0.95, amp: 22, freq: 0.0092, speed: -0.28, phase: 2.8, width: 1.0, color: "rgba(120, 160, 255, 0.22)" }
    ];
    function draw() {
      ctx.clearRect(0, 0, w, ht);
      mouse.active += (mouse.target - mouse.active) * 0.06;
      for (var i = 0; i < waves.length; i++) {
        var wv = waves[i], base = ht * wv.y;
        ctx.beginPath();
        ctx.lineWidth = wv.width;
        ctx.strokeStyle = wv.color;
        for (var x = 0; x <= w + 6; x += 6) {
          var env = 0.3 + 0.7 * Math.sin(Math.PI * Math.min(1, Math.max(0, x / w)));
          var dx = x - mouse.x;
          var boost = 1 + 1.5 * mouse.active * Math.exp(-(dx * dx) / (2 * 150 * 150));
          var y = base
            + wv.amp * env * boost * Math.sin(x * wv.freq + t * wv.speed + wv.phase)
            + wv.amp * 0.3 * env * Math.sin(x * wv.freq * 2.3 - t * wv.speed * 1.3);

    }
    function frame(ts) {

    function onLeave() { mouse.target = 0; }

      if (hero) setOnHero(hero.getBoundingClientRect().bottom > 72);
      var jobs = document.getElementById("jobs");
      if (jobs) {
        var r = jobs.getBoundingClientRect();
        var rp = REDUCED ? 1 : Math.min(1, Math.max(0, (window.innerHeight * 0.62 - r.top) / r.height));
        jobs.style.setProperty("--rail", rp.toFixed(4));
        var nodes = jobs.querySelectorAll(".job-node");
        for (var i = 0; i < nodes.length; i++) {
          var n = nodes[i];
          var top = n.parentNode.offsetTop + n.offsetTop + 6;
          n.classList.toggle("lit", REDUCED || top <= rp * r.height + 1);
        }
      }
    }
    function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
    update();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return function () { window.removeEventListener("scroll", onScroll); window.removeEventListener("resize", onScroll); };
  }, []);

  return h(React.Fragment, null,
    h(Nav, { onHero: onHero }),
    h("main", null, h(Hero, null), h(Work, null), h(Experience, null), h(Skills, null), h(Contact, null)),
    h(Footer, null)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App, null));
</script>
</body>
</html>
